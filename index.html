<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Animato — Cyberpunk CRT</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  background: #000;
  width: 100vw;
  height: 100vh;
}

#glitch-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

#photo-canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  pointer-events: none;
}

#text-layer {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  color: #fff;
  text-align: center;
  pointer-events: none;
}

.text-block {
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.text-block:nth-child(1) { animation-delay: 0.5s; }
.text-block:nth-child(2) { animation-delay: 2.0s; }
.text-block:nth-child(3) { animation-delay: 3.5s; }

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#title {
  font-size: clamp(3rem, 10vw, 8rem);
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1;
  margin-bottom: 0.25em;
  text-shadow: 0 0 30px rgba(0, 180, 255, 0.4);
  color: #fff;
}

#subtitle {
  font-size: clamp(1rem, 3vw, 2rem);
  font-weight: 300;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 1.5em;
  opacity: 0;
  color: rgba(0, 229, 255, 0.9);
}

#subtitle.reveal { opacity: 1; }

#body-text {
  font-size: clamp(0.9rem, 1.5vw, 1.2rem);
  font-weight: 400;
  line-height: 1.6;
  max-width: 640px;
  opacity: 0;
  color: rgba(255, 255, 255, 0.85);
}

#body-text.reveal { opacity: 1; }

.typing::after {
  content: '|';
  display: inline;
  animation: blink 0.8s step-end infinite;
  color: #00e5ff;
}

@keyframes blink {
  50% { opacity: 0; }
}

#mic-status {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 10;
  color: #fff;
  font-size: 0.7rem;
  font-family: monospace;
  letter-spacing: 0.1em;
  pointer-events: none;
}

#paste-hint {
  position: fixed;
  bottom: 1.5rem;
  left: 1.5rem;
  z-index: 10;
  color: #fff;
  font-size: 0.7rem;
  font-family: monospace;
  letter-spacing: 0.05em;
  pointer-events: none;
}
</style>
</head>
<body>

<canvas id="glitch-canvas"></canvas>
<canvas id="photo-canvas"></canvas>

<div id="text-layer">
  <div class="text-block">
    <h1 id="title">TITOLO</h1>
  </div>
  <div class="text-block">
    <p id="subtitle" class="reveal">Sottotitolo</p>
  </div>
  <div class="text-block">
    <p id="body-text" class="reveal typing">Testo descrittivo — modifica questo contenuto.</p>
  </div>
</div>

<div id="mic-status">ATTIVAZIONE MICROFONO...</div>
<div id="paste-hint">COPIA UN'IMMAGINE E PREMI CTRL+V PER INCOLLARLA</div>

<script>
let audioCtx, analyser, dataArray;
let micReady = false;

async function initAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    micReady = true;
    document.getElementById('mic-status').textContent = 'MICROFONO ATTIVO';
  } catch (e) {
    document.getElementById('mic-status').textContent = 'MICROFONO NON DISPONIBILE';
    micReady = false;
  }
}

function getAudioEnergy() {
  if (!micReady || !analyser) return 0;
  analyser.getByteFrequencyData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
  return sum / (dataArray.length * 255);
}

// --- Glitch canvas ---
const glitchCanvas = document.getElementById('glitch-canvas');
const gCtx = glitchCanvas.getContext('2d');

// --- Photo canvas ---
const photoCanvas = document.getElementById('photo-canvas');
const pCtx = photoCanvas.getContext('2d');

let W, H;

function resize() {
  W = glitchCanvas.width = photoCanvas.width = window.innerWidth;
  H = glitchCanvas.height = photoCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let time = 0;
let photoImage = null;

// --- Glitch params ---
let p = {
  intensity: 0,
  noise: 0,
  displace: 0,
  rgb: 0,
  scanline: 0,
  pixelate: 0,
  edgeGlow: 0,
};

function updateParams(energy) {
  const e = Math.pow(energy, 0.55);
  p.intensity = Math.min(1, e * 1.3);
  p.noise = e * 0.2;
  p.displace = e * 40;
  p.rgb = e * 14;
  p.scanline = 0.15 + e * 0.25;
  p.pixelate = e * 2.5;
  p.edgeGlow = e * 8;

  if (!micReady) {
    if (Math.random() < 0.004) {
      const b = 0.3 + Math.random() * 0.4;
      p.intensity = b;
      p.noise = b * 0.25;
      p.displace = b * 50;
      p.rgb = b * 18;
    }
    p.intensity *= 0.97;
    p.noise *= 0.95;
    p.displace *= 0.93;
    p.rgb *= 0.94;
    p.scanline = 0.15 + p.intensity * 0.15;
    p.pixelate *= 0.95;
    p.edgeGlow *= 0.94;
  }
}

// --- Draw glitch background ---
function drawGlitch() {
  const energy = getAudioEnergy();
  time += 1/60;
  updateParams(energy);

  const px = Math.max(1, Math.floor(1 + p.pixelate));
  const cw = Math.ceil(W / px);
  const ch = Math.ceil(H / px);

  gCtx.fillStyle = '#050a0f';
  gCtx.fillRect(0, 0, W, H);

  const numBands = 12 + Math.floor(p.intensity * 30);
  const bandH = ch / numBands;
  for (let i = 0; i < numBands; i++) {
    const y = i * bandH;
    const wave = Math.sin(y * 0.08 + time * 4) * p.displace * 0.5
               + Math.sin(y * 0.15 + time * 7) * p.displace * 0.3;
    const offset = Math.floor(wave / px) * px;

    const r = Math.floor(0 + Math.random() * 15 * p.intensity);
    const g = Math.floor(80 + Math.random() * 60 * p.intensity);
    const b = Math.floor(180 + Math.random() * 75 * p.intensity);
    gCtx.fillStyle = `rgb(${r},${g},${b})`;
    gCtx.fillRect(0, y * px, cw * px, Math.ceil(bandH) * px);
    gCtx.fillStyle = `rgba(0, 0, 0, ${0.2 * p.intensity})`;
    gCtx.fillRect(offset, y * px, cw * px, Math.ceil(bandH) * px);
  }

  if (p.rgb > 0.5) {
    const sx = Math.floor(((Math.random() - 0.5) * p.rgb * 2) / px) * px;
    const sy = Math.floor(((Math.random() - 0.5) * p.rgb) / px) * px;

    gCtx.fillStyle = `rgba(255, 0, 80, ${0.12 * p.intensity})`;
    gCtx.fillRect(sx, sy, cw * px, ch * px);

    gCtx.fillStyle = `rgba(0, 200, 255, ${0.12 * p.intensity})`;
    gCtx.fillRect(-sx, -sy, cw * px, ch * px);
  }

  if (p.noise > 0.01) {
    const numNoiseLines = Math.floor(3 + p.noise * 25);
    for (let i = 0; i < numNoiseLines; i++) {
      const ny = Math.floor(Math.random() * ch) * px;
      const nh = Math.floor(1 + Math.random() * (1 + p.noise * 3)) * px;
      const nw = cw * px;
      const imageData = gCtx.getImageData(0, ny, nw, nh);
      for (let j = 0; j < imageData.data.length; j += 4) {
        const v = Math.random() > 0.5 ? 255 : 0;
        imageData.data[j]     = v;
        imageData.data[j + 1] = v * 0.6;
        imageData.data[j + 2] = v * 0.8;
      }
      gCtx.putImageData(imageData, 0, ny);
    }
  }

  if (p.intensity > 0.1) {
    const nb = Math.floor(2 + p.intensity * 12);
    for (let i = 0; i < nb; i++) {
      const bw = Math.floor((10 + Math.random() * 50 * p.intensity) / px) * px;
      const bh = Math.floor((2 + Math.random() * 12 * p.intensity) / px) * px;
      const bx = Math.floor(Math.random() * (cw - bw / px)) * px;
      const by = Math.floor(Math.random() * (ch - bh / px)) * px;
      gCtx.fillStyle = `rgba(0, 180, 255, ${0.05 + p.intensity * 0.1})`;
      gCtx.fillRect(bx, by, bw, bh);
    }
  }

  if (p.scanline > 0.01) {
    for (let y = 0; y < H; y += 3) {
      gCtx.fillStyle = `rgba(0, 0, 0, ${p.scanline})`;
      gCtx.fillRect(0, y, W, 1);
    }
  }

  if (p.edgeGlow > 0.5) {
    const g = gCtx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.6);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, `rgba(0, 180, 255, ${0.04 * p.intensity})`);
    gCtx.fillStyle = g;
    gCtx.fillRect(0, 0, W, H);
  }

  const vg = gCtx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  gCtx.fillStyle = vg;
  gCtx.fillRect(0, 0, W, H);
}

// --- Draw photo layer (pixelated + distorted by voice) ---
function drawPhoto() {
  pCtx.clearRect(0, 0, W, H);

  if (!photoImage) return;

  // Pixelation + distortion grow with voice intensity
  const photoPx = Math.max(1, Math.floor(1 + p.intensity * 8));
  const pw = Math.ceil(W / photoPx);
  const ph = Math.ceil(H / photoPx);

  // Opacity fades with voice
  const opacity = Math.max(0, 1 - p.intensity * 1.1);
  if (opacity <= 0) return;

  pCtx.globalAlpha = opacity;

  // Draw at low resolution for pixelation
  pCtx.imageSmoothingEnabled = false;
  pCtx.drawImage(photoImage, 0, 0, W, H, 0, 0, pw, ph);
  pCtx.drawImage(photoCanvas, 0, 0, pw, ph, 0, 0, W, H);

  // Horizontal displacement strips on photo
  if (p.intensity > 0.1) {
    const numStrips = Math.floor(3 + p.intensity * 15);
    const stripH = Math.ceil(H / numStrips);
    for (let i = 0; i < numStrips; i++) {
      if (Math.random() > p.intensity * 0.5) continue;
      const sy = i * stripH;
      const dx = (Math.random() - 0.5) * p.intensity * 60;
      pCtx.drawImage(photoCanvas, 0, sy, W, stripH, dx, sy, W, stripH);
    }
  }

  // Noise overlay on photo
  if (p.noise > 0.05) {
    const imageData = pCtx.getImageData(0, 0, W, H);
    const data = imageData.data;
    const numNoise = Math.floor(data.length * p.noise * 0.15);
    for (let i = 0; i < numNoise; i++) {
      const idx = Math.floor(Math.random() * data.length / 4) * 4;
      data[idx] = Math.random() > 0.5 ? 255 : data[idx];
      data[idx + 1] = Math.random() > 0.5 ? 255 : data[idx + 1];
      data[idx + 2] = Math.random() > 0.5 ? 255 : data[idx + 2];
    }
    pCtx.putImageData(imageData, 0, 0);
  }

  pCtx.globalAlpha = 1;
}

// --- Main loop ---
function draw() {
  drawGlitch();
  drawPhoto();
  requestAnimationFrame(draw);
}

const bodyEl = document.getElementById('body-text');
const fullText = bodyEl.textContent.trim();
bodyEl.textContent = '';
bodyEl.classList.add('typing');
let idx = 0;
function typeWriter() {
  if (idx < fullText.length) {
    bodyEl.textContent += fullText.charAt(idx);
    idx++;
    setTimeout(typeWriter, 30 + Math.random() * 20);
  } else {
    bodyEl.classList.remove('typing');
  }
}

// Paste image from clipboard
document.addEventListener('paste', function (e) {
  const items = e.clipboardData.items;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.startsWith('image/')) {
      const blob = items[i].getAsFile();
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = function () {
        photoImage = img;
      };
      img.src = url;
      break;
    }
  }
});

initAudio();
draw();
setTimeout(typeWriter, 4500);
</script>
</body>
</html>
