<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Animato — Glitch Audio</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  background: #000;
  width: 100vw;
  height: 100vh;
}

/* --- LAYER 1: GLITCH BACKGROUND (canvas) --- */
#glitch-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
}

/* --- LAYER 2: PHOTO OVERLAY --- */
#photo-layer {
  position: fixed;
  inset: 0;
  z-index: 1;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0.25;
  mix-blend-mode: screen;
  transition: opacity 1.5s ease;
  pointer-events: none;
}

/* --- LAYER 3: TEXT OVERLAY --- */
#text-layer {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  color: #fff;
  text-align: center;
  pointer-events: none;
}

.text-block {
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.text-block:nth-child(1) { animation-delay: 0.5s; }
.text-block:nth-child(2) { animation-delay: 2.0s; }
.text-block:nth-child(3) { animation-delay: 3.5s; }

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#title {
  font-size: clamp(3rem, 10vw, 8rem);
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1;
  margin-bottom: 0.25em;
  text-shadow:
    0 0 20px rgba(0,0,0,0.8),
    2px 0 #ff0040,
    -2px 0 #00e5ff;
}

#subtitle {
  font-size: clamp(1rem, 3vw, 2rem);
  font-weight: 300;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 1.5em;
  opacity: 0;
}

#subtitle.reveal { opacity: 1; }

#body-text {
  font-size: clamp(0.9rem, 1.5vw, 1.2rem);
  font-weight: 400;
  line-height: 1.6;
  max-width: 640px;
  opacity: 0;
}

#body-text.reveal { opacity: 1; }

/* --- TYPING CURSOR --- */
.typing::after {
  content: '|';
  display: inline;
  animation: blink 0.8s step-end infinite;
  color: #ff0040;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* --- GLITCH TEXT (applied via JS) --- */
.glitch-text {
  position: relative;
}

/* --- MIC STATUS --- */
#mic-status {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 10;
  color: rgba(255,255,255,0.3);
  font-size: 0.75rem;
  font-family: monospace;
  letter-spacing: 0.1em;
  pointer-events: none;
}

#mic-status.active {
  color: rgba(0,255,100,0.6);
}
</style>
</head>
<body>

<!-- LAYER 1: GLITCH CANVAS -->
<canvas id="glitch-canvas"></canvas>

<!-- LAYER 2: PHOTO -->
<div id="photo-layer" style="background-image: url('Asset/photo.jpg');"></div>

<!-- LAYER 3: TEXT -->
<div id="text-layer">
  <div class="text-block">
    <h1 id="title" class="glitch-text">TITOLO</h1>
  </div>
  <div class="text-block">
    <p id="subtitle" class="reveal">Sottotitolo</p>
  </div>
  <div class="text-block">
    <p id="body-text" class="reveal typing">Testo descrittivo — modifica questo contenuto.</p>
  </div>
</div>

<!-- STATUS -->
<div id="mic-status">⏳ ATTIVAZIONE MICROFONO...</div>

<script>
// ============================================================
// 1. AUDIO — Microfono + Analyser
// ============================================================
let audioCtx, analyser, dataArray;
let audioEnergy = 0;
let micReady = false;

async function initAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    micReady = true;
    document.getElementById('mic-status').textContent = '🎤 MICROFONO ATTIVO';
    document.getElementById('mic-status').classList.add('active');
  } catch (e) {
    console.warn('Microfono non disponibile — glitch simulato.', e);
    document.getElementById('mic-status').textContent = '⚠️ MICROFONO NON DISPONIBILE — GLITCH SIMULATO';
    micReady = false;
  }
}

function getAudioEnergy() {
  if (!micReady || !analyser) return 0;
  analyser.getByteFrequencyData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    sum += dataArray[i];
  }
  // Normalize 0–1
  return sum / (dataArray.length * 255);
}

// ============================================================
// 2. GLITCH CANVAS
// ============================================================
const canvas = document.getElementById('glitch-canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

window.addEventListener('resize', resize);
resize();

// Parametri glitch (modulati dall'audio)
let params = {
  intensity: 0,
  noiseAmount: 0,
  displaceAmount: 0,
  rgbSplit: 0,
  scanlineOpacity: 0,
  shake: 0,
};

function updateParams(energy, dt) {
  // energy 0–1, volume percepito con curva esponenziale
  const e = Math.pow(energy, 0.6);

  params.intensity = e;
  params.noiseAmount = e * 0.15;
  params.displaceAmount = e * 40;
  params.rgbSplit = e * 12;
  params.scanlineOpacity = e * 0.3;
  params.shake = e * 6;

  // A volte un burst casuale per simulare glitch anche senza audio
  if (!micReady && Math.random() < 0.005) {
    const burst = 0.4 + Math.random() * 0.6;
    params.intensity = burst;
    params.noiseAmount = burst * 0.2;
    params.displaceAmount = burst * 60;
    params.rgbSplit = burst * 20;
    params.shake = burst * 10;
  }

  // Decay naturale
  if (!micReady) {
    params.intensity *= 0.97;
    params.noiseAmount *= 0.95;
    params.displaceAmount *= 0.92;
    params.rgbSplit *= 0.94;
    params.shake *= 0.93;
    params.scanlineOpacity *= 0.96;
  }
}

let time = 0;

function drawGlitch() {
  const energy = getAudioEnergy();
  const dt = 1/60;
  time += dt;
  updateParams(energy, dt);

  // --- Sfondo scuro ---
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  // --- RGB split (displacement su canali colore) ---
  if (params.rgbSplit > 0.5) {
    const splitX = (Math.random() - 0.5) * params.rgbSplit * 2;
    const splitY = (Math.random() - 0.5) * params.rgbSplit;

    ctx.fillStyle = `rgba(255, 0, 64, ${0.15 * params.intensity})`;
    ctx.fillRect(W * 0.1 + splitX, H * 0.1 + splitY, W * 0.8, H * 0.8);

    ctx.fillStyle = `rgba(0, 229, 255, ${0.15 * params.intensity})`;
    ctx.fillRect(W * 0.1 - splitX, H * 0.1 - splitY, W * 0.8, H * 0.8);
  }

  // --- Horizontal displacement strips ---
  if (params.displaceAmount > 1) {
    const numStrips = Math.floor(8 + params.intensity * 30);
    for (let i = 0; i < numStrips; i++) {
      const y = Math.random() * H;
      const h = 2 + Math.random() * 8 * params.intensity;
      const dx = (Math.random() - 0.5) * params.displaceAmount * 2;

      const r = Math.floor(Math.random() * 255);
      const g = Math.floor(Math.random() * 255);
      const b = Math.floor(Math.random() * 255);
      ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${0.08 + params.intensity * 0.12})`;
      ctx.fillRect(0, y, W, h);

      // Striscia nera offset
      if (dx !== 0) {
        ctx.fillStyle = `rgba(0, 0, 0, ${0.3 * params.intensity})`;
        ctx.fillRect(dx, y, W, h);
      }
    }
  }

  // --- Noise / static ---
  if (params.noiseAmount > 0.01) {
    const imageData = ctx.getImageData(0, 0, W, H);
    const data = imageData.data;
    const pixelsToGlitch = Math.floor(data.length * params.noiseAmount * 0.3);

    for (let i = 0; i < pixelsToGlitch; i++) {
      const idx = Math.floor(Math.random() * data.length);
      const val = Math.random() > 0.5 ? 255 : 0;
      data[idx] = val;
    }

    ctx.putImageData(imageData, 0, 0);
  }

  // --- Block corruption ---
  if (params.intensity > 0.2) {
    const numBlocks = Math.floor(params.intensity * 15);
    for (let i = 0; i < numBlocks; i++) {
      const bw = 20 + Math.random() * 80 * params.intensity;
      const bh = 4 + Math.random() * 20 * params.intensity;
      const bx = Math.random() * (W - bw);
      const by = Math.random() * (H - bh);
      const gray = Math.floor(Math.random() * 256);
      ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
      ctx.fillRect(bx, by, bw, bh);
    }
  }

  // --- Scanlines ---
  if (params.scanlineOpacity > 0.01) {
    ctx.fillStyle = `rgba(0, 0, 0, ${params.scanlineOpacity})`;
    for (let y = 0; y < H; y += 3) {
      ctx.fillRect(0, y, W, 1);
    }
  }

  // --- Vignetta ---
  const grad = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.8);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(drawGlitch);
}

// ============================================================
// 3. TYPING ANIMATION
// ============================================================
const bodyEl = document.getElementById('body-text');
const fullText = bodyEl.textContent.trim();
bodyEl.textContent = '';
bodyEl.classList.add('typing');

let index = 0;
function typeWriter() {
  if (index < fullText.length) {
    bodyEl.textContent += fullText.charAt(index);
    index++;
    setTimeout(typeWriter, 30 + Math.random() * 20);
  } else {
    bodyEl.classList.remove('typing');
  }
}

// ============================================================
// 4. START
// ============================================================
initAudio();
drawGlitch();
setTimeout(typeWriter, 4500);
</script>
</body>
</html>
