<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Animato — Cyberpunk CRT</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  background: #000;
  width: 100vw;
  height: 100vh;
}

/* --- LAYER 1: GLITCH BACKGROUND --- */
#glitch-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

/* --- LAYER 2: PHOTO (clean, no glitch) --- */
#photo-layer {
  position: fixed;
  inset: 0;
  z-index: 1;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0.3;
  mix-blend-mode: screen;
  pointer-events: none;
}

/* --- LAYER 3: TEXT (clean, no glitch) --- */
#text-layer {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  color: #fff;
  text-align: center;
  pointer-events: none;
}

.text-block {
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.text-block:nth-child(1) { animation-delay: 0.5s; }
.text-block:nth-child(2) { animation-delay: 2.0s; }
.text-block:nth-child(3) { animation-delay: 3.5s; }

@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#title {
  font-size: clamp(3rem, 10vw, 8rem);
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 1;
  margin-bottom: 0.25em;
  text-shadow: 0 0 30px rgba(0, 180, 255, 0.4);
  color: #fff;
}

#subtitle {
  font-size: clamp(1rem, 3vw, 2rem);
  font-weight: 300;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 1.5em;
  opacity: 0;
  color: rgba(0, 229, 255, 0.9);
}

#subtitle.reveal { opacity: 1; }

#body-text {
  font-size: clamp(0.9rem, 1.5vw, 1.2rem);
  font-weight: 400;
  line-height: 1.6;
  max-width: 640px;
  opacity: 0;
  color: rgba(255, 255, 255, 0.85);
}

#body-text.reveal { opacity: 1; }

.typing::after {
  content: '|';
  display: inline;
  animation: blink 0.8s step-end infinite;
  color: #00e5ff;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* --- MIC STATUS --- */
#mic-status {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 10;
  color: rgba(0, 229, 255, 0.25);
  font-size: 0.7rem;
  font-family: monospace;
  letter-spacing: 0.1em;
  pointer-events: none;
}

#mic-status.active {
  color: rgba(0, 229, 255, 0.7);
}
</style>
</head>
<body>

<canvas id="glitch-canvas"></canvas>

<div id="photo-layer" style="background-image: url('Asset/photo.jpg');"></div>

<div id="text-layer">
  <div class="text-block">
    <h1 id="title">TITOLO</h1>
  </div>
  <div class="text-block">
    <p id="subtitle" class="reveal">Sottotitolo</p>
  </div>
  <div class="text-block">
    <p id="body-text" class="reveal typing">Testo descrittivo — modifica questo contenuto.</p>
  </div>
</div>

<div id="mic-status">⏳ ATTIVAZIONE MICROFONO...</div>

<script>
// ============================================================
// AUDIO
// ============================================================
let audioCtx, analyser, dataArray;
let audioEnergy = 0;
let micReady = false;

async function initAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    micReady = true;
    document.getElementById('mic-status').textContent = '🎤 MICROFONO ATTIVO';
    document.getElementById('mic-status').classList.add('active');
  } catch (e) {
    document.getElementById('mic-status').textContent = '⚠️ MICROFONO NON DISPONIBILE — GLITCH SIMULATO';
    micReady = false;
  }
}

function getAudioEnergy() {
  if (!micReady || !analyser) return 0;
  analyser.getByteFrequencyData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
  return sum / (dataArray.length * 255);
}

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('glitch-canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let time = 0;

// ============================================================
// GLITCH PARAMS
// ============================================================
let p = {
  intensity: 0,
  noise: 0,
  displace: 0,
  rgb: 0,
  scanline: 0,
  pixelate: 0,
  edgeGlow: 0,
};

function updateParams(energy) {
  const e = Math.pow(energy, 0.55);
  p.intensity = Math.min(1, e * 1.3);
  p.noise = e * 0.2;
  p.displace = e * 40;
  p.rgb = e * 14;
  p.scanline = 0.15 + e * 0.25;
  p.pixelate = e * 2.5;
  p.edgeGlow = e * 8;

  if (!micReady) {
    if (Math.random() < 0.004) {
      const b = 0.3 + Math.random() * 0.4;
      p.intensity = b;
      p.noise = b * 0.25;
      p.displace = b * 50;
      p.rgb = b * 18;
    }
    p.intensity *= 0.97;
    p.noise *= 0.95;
    p.displace *= 0.93;
    p.rgb *= 0.94;
    p.scanline = 0.15 + p.intensity * 0.15;
    p.pixelate *= 0.95;
    p.edgeGlow *= 0.94;
  }
}

// ============================================================
// DRAW GLITCH
// ============================================================
function draw() {
  const energy = getAudioEnergy();
  time += 1/60;
  updateParams(energy);

  // --- Pixelation (disegno a risoluzione ridotta) ---
  const px = Math.max(1, Math.floor(1 + p.pixelate));
  const cw = Math.ceil(W / px);
  const ch = Math.ceil(H / px);

  ctx.fillStyle = '#050a0f';
  ctx.fillRect(0, 0, W, H);

  // --- Onde di distorsione digitali ---
  const numBands = 12 + Math.floor(p.intensity * 30);
  const bandH = ch / numBands;
  for (let i = 0; i < numBands; i++) {
    const y = i * bandH;
    const wave = Math.sin(y * 0.08 + time * 4) * p.displace * 0.5
               + Math.sin(y * 0.15 + time * 7) * p.displace * 0.3;
    const offset = Math.floor(wave / px) * px;

    const r = Math.floor(0 + Math.random() * 15 * p.intensity);
    const g = Math.floor(80 + Math.random() * 60 * p.intensity);
    const b = Math.floor(180 + Math.random() * 75 * p.intensity);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(0, y * px, cw * px, Math.ceil(bandH) * px);
    ctx.fillStyle = `rgba(0, 0, 0, ${0.2 * p.intensity})`;
    ctx.fillRect(offset, y * px, cw * px, Math.ceil(bandH) * px);
  }

  // --- RGB split (aberrazione cromatica) ---
  if (p.rgb > 0.5) {
    const sx = Math.floor(((Math.random() - 0.5) * p.rgb * 2) / px) * px;
    const sy = Math.floor(((Math.random() - 0.5) * p.rgb) / px) * px;

    ctx.fillStyle = `rgba(255, 0, 80, ${0.12 * p.intensity})`;
    ctx.fillRect(sx, sy, cw * px, ch * px);

    ctx.fillStyle = `rgba(0, 200, 255, ${0.12 * p.intensity})`;
    ctx.fillRect(-sx, -sy, cw * px, ch * px);
  }

  // --- VHS Static Noise ---
  if (p.noise > 0.01) {
    const numNoiseLines = Math.floor(3 + p.noise * 25);
    for (let i = 0; i < numNoiseLines; i++) {
      const ny = Math.floor(Math.random() * ch) * px;
      const nh = Math.floor(1 + Math.random() * (1 + p.noise * 3)) * px;
      const nw = cw * px;
      const imageData = ctx.getImageData(0, ny, nw, nh);
      for (let j = 0; j < imageData.data.length; j += 4) {
        const v = Math.random() > 0.5 ? 255 : 0;
        imageData.data[j]     = v;
        imageData.data[j + 1] = v * 0.6;
        imageData.data[j + 2] = v * 0.8;
      }
      ctx.putImageData(imageData, 0, ny);
    }
  }

  // --- Digital blocks (corruzione) ---
  if (p.intensity > 0.1) {
    const nb = Math.floor(2 + p.intensity * 12);
    for (let i = 0; i < nb; i++) {
      const bw = Math.floor((10 + Math.random() * 50 * p.intensity) / px) * px;
      const bh = Math.floor((2 + Math.random() * 12 * p.intensity) / px) * px;
      const bx = Math.floor(Math.random() * (cw - bw / px)) * px;
      const by = Math.floor(Math.random() * (ch - bh / px)) * px;
      ctx.fillStyle = `rgba(0, 180, 255, ${0.05 + p.intensity * 0.1})`;
      ctx.fillRect(bx, by, bw, bh);
    }
  }

  // --- CRT Scanlines ---
  if (p.scanline > 0.01) {
    for (let y = 0; y < H; y += 3) {
      ctx.fillStyle = `rgba(0, 0, 0, ${p.scanline})`;
      ctx.fillRect(0, y, W, 1);
    }
  }

  // --- Edge glow (ciano/blu) ---
  if (p.edgeGlow > 0.5) {
    const glow = p.edgeGlow;
    const g = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.6);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, `rgba(0, 180, 255, ${0.04 * p.intensity})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // --- Vignetta scura ---
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(draw);
}

// ============================================================
// TYPING
// ============================================================
const bodyEl = document.getElementById('body-text');
const fullText = bodyEl.textContent.trim();
bodyEl.textContent = '';
bodyEl.classList.add('typing');
let idx = 0;
function typeWriter() {
  if (idx < fullText.length) {
    bodyEl.textContent += fullText.charAt(idx);
    idx++;
    setTimeout(typeWriter, 30 + Math.random() * 20);
  } else {
    bodyEl.classList.remove('typing');
  }
}

// ============================================================
// START
// ============================================================
initAudio();
draw();
setTimeout(typeWriter, 4500);
</script>
</body>
</html>
