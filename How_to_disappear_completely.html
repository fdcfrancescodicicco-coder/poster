<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Animato — Cyberpunk CRT</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  overflow: hidden;
  background: #000;
  width: 100vw;
  height: 100vh;
}

#glitch-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

#photo-canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  pointer-events: none;
  mix-blend-mode: multiply;
}

#text-overlay-canvas {
  position: fixed;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  pointer-events: none;
}


#paste-hint {
  position: fixed;
  bottom: 1.5rem;
  left: 1.5rem;
  z-index: 10;
  color: #fff;
  font-size: 0.55rem;
  font-family: monospace;
  letter-spacing: 0.08em;
  pointer-events: none;
  transition: opacity 0.4s;
}

#paste-hint.hidden { opacity: 0; }
.toggleable { transition: opacity 0.4s; }
.toggleable.hidden { opacity: 0 !important; pointer-events: none !important; }

#mic-status {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  z-index: 10;
  color: #fff;
  font-size: 0.55rem;
  font-family: monospace;
  letter-spacing: 0.08em;
  pointer-events: none;
  transition: opacity 0.4s;
}

#mic-status.hidden { opacity: 0; }

#ui-toggle {
  position: fixed;
  bottom: 0.7rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  color: #fff;
  font-size: 0.5rem;
  font-family: monospace;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: opacity 0.3s;
  user-select: none;
  opacity: 0.35;
  background: none;
  border: none;
  padding: 0;
  line-height: 1;
}

#ui-toggle:hover {
  opacity: 1;
}

#mic-toggle {
  position: fixed;
  bottom: 0.7rem;
  right: 1.5rem;
  z-index: 20;
  color: #fff;
  font-size: 0.5rem;
  font-family: monospace;
  letter-spacing: 0.1em;
  cursor: pointer;
  user-select: none;
  opacity: 0.5;
  transition: opacity 0.3s;
}

#mic-toggle:hover {
  opacity: 1;
}

#mic-toggle.off {
  opacity: 0.25;
  color: rgba(255, 100, 100, 0.6);
}

#photo-btn, #video-btn {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  color: #fff;
  font-size: 0.55rem;
  font-family: monospace;
  letter-spacing: 0.12em;
  cursor: pointer;
  opacity: 0.5;
  background: none;
  border: 1px solid rgba(255,255,255,0.25);
  padding: 6px 14px;
  transition: opacity 0.3s;
}

#photo-btn:hover, #video-btn:hover {
  opacity: 1;
}

#photo-btn {
  bottom: 1.5rem;
}

#video-btn {
  bottom: 3.5rem;
}

#webcam-btn {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  color: #fff;
  font-size: 0.55rem;
  font-family: monospace;
  letter-spacing: 0.12em;
  cursor: pointer;
  opacity: 0.5;
  background: none;
  border: 1px solid rgba(255,255,255,0.25);
  padding: 6px 14px;
  bottom: 5.5rem;
  transition: opacity 0.3s;
}

#webcam-btn:hover {
  opacity: 1;
}

#webcam-btn.active {
  opacity: 1;
  border-color: rgba(0, 255, 100, 0.5);
}


</style>
</head>
<body>

<canvas id="glitch-canvas"></canvas>
<canvas id="photo-canvas"></canvas>
<canvas id="text-overlay-canvas"></canvas>

<div id="mic-status" class="toggleable">ATTIVAZIONE MICROFONO...</div>
<div id="mic-toggle">MIC: ON</div>

<div id="ui-toggle">NASCONDI</div>

<div id="paste-hint" class="toggleable">COPIA UN'IMMAGINE (CTRL+V)</div>
<input type="file" id="photo-input" accept="image/*" style="display:none">
<input type="file" id="video-input" accept="video/*" style="display:none">
<video id="video-source" loop style="display:none"></video>
<video id="webcam-source" autoplay playsinline style="display:none"></video>
<button id="photo-btn" class="toggleable">CARICA FOTO</button>
<button id="video-btn" class="toggleable">CARICA VIDEO</button>
<button id="webcam-btn">WEBCAM: OFF</button>


<script>
let audioCtx, analyser, dataArray;
let micReady = false;
let micStream = null;
let webcamStream = null;
let webcamActive = false;
let webcamVideo = null;

async function initAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micStream = stream;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    micReady = true;
    document.getElementById('mic-status').textContent = 'MICROFONO ATTIVO';
    document.getElementById('mic-toggle').textContent = 'MIC: ON';
    document.getElementById('mic-toggle').classList.remove('off');
  } catch (e) {
    document.getElementById('mic-status').textContent = 'MICROFONO NON DISPONIBILE';
    micReady = false;
  }
}

function stopMic() {
  if (micStream) {
    micStream.getTracks().forEach(function (t) { t.stop(); });
  }
  if (audioCtx) {
    audioCtx.close();
  }
  micReady = false;
  document.getElementById('mic-status').textContent = 'MICROFONO SPENTO';
  document.getElementById('mic-toggle').textContent = 'MIC: OFF';
  document.getElementById('mic-toggle').classList.add('off');
}

function getAudioEnergy() {
  if (!micReady || !analyser) return 0;
  analyser.getByteFrequencyData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
  return sum / (dataArray.length * 255);
}

// --- Glitch canvas ---
const glitchCanvas = document.getElementById('glitch-canvas');
const gCtx = glitchCanvas.getContext('2d');

// --- Photo canvas ---
const photoCanvas = document.getElementById('photo-canvas');
const pCtx = photoCanvas.getContext('2d');

// --- Text overlay canvas ---
const textOverlayCanvas = document.getElementById('text-overlay-canvas');
const tCtx = textOverlayCanvas.getContext('2d');

let W, H;

function resize() {
  W = glitchCanvas.width = photoCanvas.width = textOverlayCanvas.width = window.innerWidth;
  H = glitchCanvas.height = photoCanvas.height = textOverlayCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let time = 0;
let photoImage = null;
let videoElement = null;
let pixelTemp = null;

// --- Glitch params ---
let p = {
  intensity: 0,
  noise: 0,
  displace: 0,
  rgb: 0,
  scanline: 0,
  pixelate: 0,
  edgeGlow: 0,
};

function updateParams(energy) {
  const e = Math.pow(energy, 0.55);
  p.intensity = Math.min(1, e * 1.3);
  p.noise = e * 0.2;
  p.displace = e * 40;
  p.rgb = e * 14;
  p.scanline = 0.15 + e * 0.25;
  p.pixelate = e * 2.5;
  p.edgeGlow = e * 8;

  if (!micReady) {
    if (Math.random() < 0.004) {
      const b = 0.3 + Math.random() * 0.4;
      p.intensity = b;
      p.noise = b * 0.25;
      p.displace = b * 50;
      p.rgb = b * 18;
    }
    p.intensity *= 0.97;
    p.noise *= 0.95;
    p.displace *= 0.93;
    p.rgb *= 0.94;
    p.scanline = 0.15 + p.intensity * 0.15;
    p.pixelate *= 0.95;
    p.edgeGlow *= 0.94;
  }
}

// --- Draw glitch background ---
function drawGlitch() {
  const energy = getAudioEnergy();
  time += 1/60;
  updateParams(energy);

  const px = Math.max(1, Math.floor(1 + p.pixelate));
  const cw = Math.ceil(W / px);
  const ch = Math.ceil(H / px);

  gCtx.fillStyle = '#050a0f';
  gCtx.fillRect(0, 0, W, H);

  const numBands = 12 + Math.floor(p.intensity * 30);
  const bandH = ch / numBands;
  for (let i = 0; i < numBands; i++) {
    const y = i * bandH;
    const wave = Math.sin(y * 0.08 + time * 4) * p.displace * 0.5
               + Math.sin(y * 0.15 + time * 7) * p.displace * 0.3;
    const offset = Math.floor(wave / px) * px;

    const r = Math.floor(0 + Math.random() * 15 * p.intensity);
    const g = Math.floor(80 + Math.random() * 60 * p.intensity);
    const b = Math.floor(180 + Math.random() * 75 * p.intensity);
    gCtx.fillStyle = `rgb(${r},${g},${b})`;
    gCtx.fillRect(0, y * px, cw * px, Math.ceil(bandH) * px);
    gCtx.fillStyle = `rgba(0, 0, 0, ${0.2 * p.intensity})`;
    gCtx.fillRect(offset, y * px, cw * px, Math.ceil(bandH) * px);
  }

  if (p.rgb > 0.5) {
    const sx = Math.floor(((Math.random() - 0.5) * p.rgb * 2) / px) * px;
    const sy = Math.floor(((Math.random() - 0.5) * p.rgb) / px) * px;

    gCtx.fillStyle = `rgba(255, 0, 80, ${0.12 * p.intensity})`;
    gCtx.fillRect(sx, sy, cw * px, ch * px);

    gCtx.fillStyle = `rgba(0, 200, 255, ${0.12 * p.intensity})`;
    gCtx.fillRect(-sx, -sy, cw * px, ch * px);
  }

  if (p.noise > 0.01) {
    const numNoiseLines = Math.floor(3 + p.noise * 25);
    for (let i = 0; i < numNoiseLines; i++) {
      const ny = Math.floor(Math.random() * ch) * px;
      const nh = Math.floor(1 + Math.random() * (1 + p.noise * 3)) * px;
      const nw = cw * px;
      const imageData = gCtx.getImageData(0, ny, nw, nh);
      for (let j = 0; j < imageData.data.length; j += 4) {
        const v = Math.random() > 0.5 ? 255 : 0;
        imageData.data[j]     = v;
        imageData.data[j + 1] = v * 0.6;
        imageData.data[j + 2] = v * 0.8;
      }
      gCtx.putImageData(imageData, 0, ny);
    }
  }

  if (p.intensity > 0.1) {
    const nb = Math.floor(2 + p.intensity * 12);
    for (let i = 0; i < nb; i++) {
      const bw = Math.floor((10 + Math.random() * 50 * p.intensity) / px) * px;
      const bh = Math.floor((2 + Math.random() * 12 * p.intensity) / px) * px;
      const bx = Math.floor(Math.random() * (cw - bw / px)) * px;
      const by = Math.floor(Math.random() * (ch - bh / px)) * px;
      gCtx.fillStyle = `rgba(0, 180, 255, ${0.05 + p.intensity * 0.1})`;
      gCtx.fillRect(bx, by, bw, bh);
    }
  }

  if (p.scanline > 0.01) {
    for (let y = 0; y < H; y += 3) {
      gCtx.fillStyle = `rgba(0, 0, 0, ${p.scanline})`;
      gCtx.fillRect(0, y, W, 1);
    }
  }

  if (p.edgeGlow > 0.5) {
    const g = gCtx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.6);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, `rgba(0, 180, 255, ${0.04 * p.intensity})`);
    gCtx.fillStyle = g;
    gCtx.fillRect(0, 0, W, H);
  }

  const vg = gCtx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  gCtx.fillStyle = vg;
  gCtx.fillRect(0, 0, W, H);
}

function drawPhoto() {
  pCtx.clearRect(0, 0, W, H);

  const source = webcamActive && webcamVideo ? webcamVideo : (videoElement && !videoElement.paused) ? videoElement : photoImage;
  if (!source) return;

  const w = source.videoWidth || source.width;
  const h = source.videoHeight || source.height;
  const imgAspect = w / h;
  const screenAspect = W / H;
  let sx, sy, sw, sh;
  if (imgAspect > screenAspect) {
    sh = h;
    sw = sh * screenAspect;
    sx = (w - sw) / 2;
    sy = 0;
  } else {
    sw = w;
    sh = sw / screenAspect;
    sx = 0;
    sy = (h - sh) / 2;
  }
  pCtx.drawImage(source, sx, sy, sw, sh, 0, 0, W, H);

  const energy = getAudioEnergy();
  if (energy > 0.03) {
    const imageData = pCtx.getImageData(0, 0, W, H);
    const d = imageData.data;
    const out = new Uint8ClampedArray(d);
    const shift = energy * 50;
    const numBands = 8 + Math.floor(energy * 20);

    for (let i = 0; i < numBands; i++) {
      const x = Math.floor(Math.random() * W);
      const bw = 2 + Math.floor(Math.random() * 8 * energy);
      const offset = Math.floor((Math.random() - 0.5) * shift);

      for (let col = x; col < Math.min(W, x + bw); col++) {
        for (let row = 0; row < H; row++) {
          const srcRow = Math.max(0, Math.min(H - 1, row + offset));
          const si = (srcRow * W + col) * 4;
          const di = (row * W + col) * 4;
          out[di] = d[si];
          out[di + 1] = d[si + 1];
          out[di + 2] = d[si + 2];
          out[di + 3] = d[si + 3];
        }
      }
    }

    imageData.data.set(out);
    pCtx.putImageData(imageData, 0, 0);
  }

  if (webcamActive) {
    const pw = Math.ceil(W / 20);
    const ph = Math.ceil(H / 20);
    if (!pixelTemp || pixelTemp.width !== pw || pixelTemp.height !== ph) {
      pixelTemp = document.createElement('canvas');
      pixelTemp.width = pw;
      pixelTemp.height = ph;
    }
    const tmp = pixelTemp.getContext('2d');
    tmp.drawImage(pCtx.canvas, 0, 0, pw, ph);
    pCtx.imageSmoothingEnabled = false;
    pCtx.clearRect(0, 0, W, H);
    pCtx.drawImage(pixelTemp, 0, 0, W, H);
  }
}

const glitchText = "HOW TO DISAPPEAR COMPLETELY";
const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+=-_<>?/\\|~";

function drawGlitchTextOnCtx(ctx, energy) {
  const intensity = Math.min(1, energy * 4);
  const fontSize = 14 + intensity * 20;
  ctx.font = `bold ${fontSize}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const centerX = W / 2;
  const centerY = H / 2;

  const spread = intensity * 100;
  const rgbShift = intensity * 6;

  for (let i = 0; i < glitchText.length; i++) {
    const char = glitchText[i];
    const xPos = centerX + (i - glitchText.length / 2) * (fontSize * 0.65);

    const offsetX = (Math.random() - 0.5) * spread;
    const offsetY = (Math.random() - 0.5) * spread;
    const rot = (Math.random() - 0.5) * intensity * 0.5;
    const scale = 1 + (Math.random() - 0.5) * intensity * 1.5;

    const displayChar = intensity > 0.1 && Math.random() < intensity * 0.6
      ? chars[Math.floor(Math.random() * chars.length)]
      : char;

    ctx.save();
    ctx.translate(xPos + offsetX, centerY + offsetY);
    ctx.rotate(rot);
    ctx.scale(scale, 1);

    if (intensity > 0.3) {
      ctx.fillStyle = `rgba(255, 0, 80, ${0.5})`;
      ctx.fillText(displayChar, rgbShift, 0);
      ctx.fillStyle = `rgba(0, 200, 255, ${0.5})`;
      ctx.fillText(displayChar, -rgbShift, 0);
    }

    ctx.fillStyle = '#fff';
    ctx.fillText(displayChar, 0, 0);
    ctx.restore();
  }
}

// --- Main loop ---
function draw() {
  const energy = getAudioEnergy();
  drawGlitch();
  drawPhoto();
  tCtx.clearRect(0, 0, W, H);
  drawGlitchTextOnCtx(tCtx, energy);
  requestAnimationFrame(draw);
}

// Paste image from clipboard
document.addEventListener('paste', function (e) {
  const items = e.clipboardData.items;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.startsWith('image/')) {
      const blob = items[i].getAsFile();
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = function () {
        const vid = document.getElementById('video-source');
        vid.pause();
        vid.src = '';
        videoElement = null;
        photoImage = img;
      };
      img.src = url;
      break;
    }
  }
});

// Photo file input
const photoInput = document.getElementById('photo-input');
const photoBtn = document.getElementById('photo-btn');
photoBtn.addEventListener('click', function () {
  photoInput.click();
});
photoInput.addEventListener('change', function () {
  const file = this.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = function () {
    const vid = document.getElementById('video-source');
    vid.pause();
    vid.src = '';
    videoElement = null;
    photoImage = img;
    if (webcamActive) toggleWebcam();
  };
  img.src = url;
});

// Video file input
const videoInput = document.getElementById('video-input');
const videoBtn = document.getElementById('video-btn');
videoBtn.addEventListener('click', function () {
  videoInput.click();
});
videoInput.addEventListener('change', function () {
  const file = this.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const vid = document.getElementById('video-source');
  vid.src = url;
  vid.play();
  videoElement = vid;
  photoImage = null;
  if (webcamActive) toggleWebcam();
});

async function toggleWebcam() {
  if (webcamActive) {
    if (webcamStream) {
      webcamStream.getTracks().forEach(function (t) { t.stop(); });
    }
    webcamActive = false;
    webcamVideo = null;
    document.getElementById('webcam-btn').textContent = 'WEBCAM: OFF';
    document.getElementById('webcam-btn').classList.remove('active');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    webcamStream = stream;
    const vid = document.getElementById('webcam-source');
    vid.srcObject = stream;
    await vid.play();
    webcamVideo = vid;
    webcamActive = true;
    document.getElementById('webcam-btn').textContent = 'WEBCAM: ON';
    document.getElementById('webcam-btn').classList.add('active');
  } catch (e) {
    document.getElementById('webcam-btn').textContent = 'WEBCAM: ERRORE';
  }
}

document.getElementById('webcam-btn').addEventListener('click', toggleWebcam);

initAudio();
draw();

// Toggle UI
const toggleBtn = document.getElementById('ui-toggle');
toggleBtn.addEventListener('click', function () {
  const toggleable = document.querySelectorAll('.toggleable');
  const isHidden = toggleable[0] && toggleable[0].classList.contains('hidden');
  for (const el of toggleable) {
    el.classList.toggle('hidden', !isHidden);
  }
  toggleBtn.textContent = isHidden ? 'NASCONDI' : 'MOSTRA';
});

// Toggle MIC
const micToggle = document.getElementById('mic-toggle');
micToggle.addEventListener('click', function () {
  if (micReady) {
    stopMic();
  } else {
    initAudio();
  }
});
</script>
</body>
</html>
